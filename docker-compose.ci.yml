version: '3.8'

services:
  # Backend tests
  backend-test:
    build:
      context: ./python-be
      dockerfile: Dockerfile.test
    container_name: translator-backend-test
    environment:
      - API_KEY=test-api-key
      - ADMIN_SECRET=test-admin-secret
      - DATABASE_URL=sqlite:///:memory:
      - AZURE_OPENAI_KEY=test-key
      - AZURE_OPENAI_ENDPOINT=https://test.openai.azure.com/
      - AZURE_SPEECH_KEY=test-key
      - AZURE_SPEECH_REGION=westeurope
      - PROMTE_API_KEY=test-key
    command: pytest tests -v --cov=src --cov-report=term-missing

  # Backend linting
  backend-lint:
    build:
      context: ./python-be
      dockerfile: Dockerfile.test
    container_name: translator-backend-lint
    command: sh -c "flake8 src tests --max-line-length=120 --ignore=E501,W503"

  # Frontend tests
  frontend-test:
    build:
      context: ./react-fe
      dockerfile: Dockerfile.ci
    container_name: translator-frontend-test
    command: npm run test:run

  # Frontend lint and typecheck
  frontend-lint:
    build:
      context: ./react-fe
      dockerfile: Dockerfile.ci
    container_name: translator-frontend-lint
    command: sh -c "npm run lint && npm run typecheck"

  # Frontend build
  frontend-build:
    build:
      context: ./react-fe
      dockerfile: Dockerfile.ci
    container_name: translator-frontend-build
    command: npm run build
